<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A920Pro Setup Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --ink-2:#474747; --line:#E2E2E2; --soft:#F1F1F1;
  --stage:#FFF1DB; --stage-2:#F8E2BF; --tip:#FFF1DB; --accent:#71E6AF; --on-accent:#000000;
  --node-idle:#C6C6C6; --tag-bg:#000000; --tag-ink:#FFFFFF; --focus:#000000;
  --chip-bg:#FFFFFF; --chip-line:#C6C6C6;
  --f-head:'Centra No2','Albert Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --stage-h:calc(100vh - 100px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1B1B; --ink:#FFFFFF; --ink-2:#C6C6C6; --line:#303030; --soft:#262626;
    --stage:#2E2E2E; --stage-2:#1F1F1F; --tip:#303030; --node-idle:#5E5E5E;
    --tag-bg:#FFFFFF; --tag-ink:#000000; --focus:#FFFFFF; --chip-bg:#1B1B1B; --chip-line:#5E5E5E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1B1B; --ink:#FFFFFF; --ink-2:#C6C6C6; --line:#303030; --soft:#262626;
  --stage:#2E2E2E; --stage-2:#1F1F1F; --tip:#303030; --node-idle:#5E5E5E;
  --tag-bg:#FFFFFF; --tag-ink:#000000; --focus:#FFFFFF; --chip-bg:#1B1B1B; --chip-line:#5E5E5E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.embed{--stage-h:calc(100vh - 32px)}
.embed .top{display:none}
.embed .app{padding-block:16px 32px}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}

.top{max-width:1440px;margin:0 auto;padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:block;width:84px;color:var(--ink)}
.brand svg{display:block;width:100%;height:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .15s ease, background-color .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:#5fdca1}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}

.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;height:34px;min-width:44px;padding:0 12px;border-radius:999px;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.app{max-width:1440px;margin:0 auto;padding-inline:24px;padding-block:0 48px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr);gap:40px;align-items:start}
.stage-col{position:sticky;top:16px;height:var(--stage-h);max-height:880px;min-height:420px}
.stage{position:relative;height:100%;border-radius:24px;overflow:hidden;background:radial-gradient(110% 80% at 50% 38%,var(--stage) 0%,var(--stage) 52%,var(--stage-2) 100%)}
#gl{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;outline:none}
#gl.grabbing{cursor:grabbing}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;background:var(--tag-bg);color:var(--tag-ink);font-size:12px;font-weight:600;line-height:1;padding:8px 12px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .35s ease;will-change:transform}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:10px;background:var(--tag-bg);transform:translateX(-50%)}
.tag.on{opacity:1}
.stage-top{position:absolute;left:16px;top:16px;right:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.pill{background:var(--bg);color:var(--ink);font-size:12px;font-weight:600;padding:8px 12px;border-radius:999px;line-height:1}
.stage-bottom{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
.hint{font-size:12px;font-weight:600;color:var(--ink);opacity:.72;display:inline-flex;align-items:center;gap:6px}
.hint svg{width:16px;height:16px}
.stage-btns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--bg);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.sq{width:36px;padding:0;justify-content:center}
.icon-btn:hover{background:var(--soft)}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:left}
.stage-msg p{max-width:36ch;margin:0;font-weight:600}

.panel{min-width:0;padding-top:8px}
.eyebrow{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
h1{font-family:var(--f-head);font-weight:700;font-size:40px;line-height:1.02;letter-spacing:-0.03em;margin:0 0 16px;text-wrap:balance;max-width:15ch}
.lead{margin:0 0 32px;max-width:52ch;color:var(--ink-2)}
h2{font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:-0.02em;margin:0 0 8px}

.phase{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0;padding:12px 0 4px 48px;position:relative}
.phase::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--line)}
.phase.first::before{top:50%}
.phase.done::before{background:var(--ink)}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;padding-left:48px;scroll-margin-top:24px}
.step::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--line)}
.step.last::before{bottom:auto;height:24px}
.step.done::before{background:var(--ink)}
.step.current::before{background:linear-gradient(var(--ink) 0 24px,var(--line) 24px)}
.node{position:absolute;left:2px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:2px solid var(--node-idle);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink);transition:background-color .2s ease,border-color .2s ease}
.node .chk{display:none;width:16px;height:16px}
.step.done .node{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.done .node .num{display:none}
.step.done .node .chk{display:block}
.step.current .node{background:var(--accent);border-color:var(--accent);color:#000}
.step-head{display:flex;align-items:center;width:100%;min-height:48px;padding:8px 0;border:0;background:none;text-align:left;cursor:pointer;font-family:var(--f-head);font-weight:500;font-size:20px;line-height:1.15;letter-spacing:-0.015em}
.step:not(.current) .step-head{color:var(--ink-2)}
.step:not(.current) .step-head:hover{color:var(--ink)}
.step:not(.current) .step-body{display:none}
.step-body{padding:4px 0 28px;max-width:60ch}
.step-body p{margin:0 0 12px}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 16px;padding:0;list-style:none}
.path li{display:inline-flex;align-items:center;gap:8px}
.chip{display:inline-block;background:var(--chip-bg);border:1px solid var(--chip-line);border-radius:4px;padding:4px 8px;font-weight:600;line-height:1.3}
.path .sep{width:12px;height:12px;flex:none;color:var(--ink-2)}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--tip);border-radius:12px;padding:12px 16px;margin:4px 0 16px}
.tip strong{flex:none;font-weight:600}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}

.help{margin-top:40px;padding-top:32px;border-top:1px solid var(--line)}
.help > p{margin:0 0 20px;color:var(--ink-2)}
.help-list{display:grid;gap:12px}
.help-card{background:var(--soft);border-radius:12px;padding:16px 20px}
.help-card h3{margin:0 0 6px;font-size:16px;font-weight:600;line-height:1.35}
.help-card p{margin:0}
.help-card .btn{height:40px;margin-top:12px}
.help-card a.inline{font-weight:600}
.footnote{margin:24px 0 0;font-size:12px;color:var(--ink-2);max-width:60ch}

@media (max-width:960px){
  .top{padding:16px 16px 12px}
  .app{grid-template-columns:1fr;padding-inline:16px;gap:24px}
  .stage-col{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:46vh;height:46svh;min-height:300px;max-height:520px;margin-inline:-16px}
  .stage{border-radius:0 0 24px 24px}
  .step{scroll-margin-top:calc(46svh + 16px)}
  h1{font-size:32px}
  .hint span{display:none}
  .stage-btns .icon-btn span{display:none}
  .stage-btns .icon-btn{width:36px;padding:0;justify-content:center}
  .stage-top{left:12px;top:12px}
  .stage-bottom{left:12px;right:12px;bottom:12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* terminal-only mode, embedded next to Yabie Webbkassa */
.termonly,.termonly body{height:100%;background:transparent}
.termonly .top,.termonly .panel{display:none!important}
.termonly .app{display:block;max-width:none;padding:0!important;height:100vh;height:100svh}
.termonly .stage-col{position:static;height:100%;max-height:none;min-height:0;margin:0}
.termonly .stage{border-radius:18px}
.termonly .hint span{display:none}
.termonly .stage-btns .icon-btn span{display:none}
.termonly .stage-btns .icon-btn{width:36px;padding:0;justify-content:center}
</style>

</head>

<main class="app">
  <section class="stage-col" aria-label="3D">
    <div class="stage" id="stage">
      <canvas id="gl" tabindex="0" role="img" aria-label="3D"></canvas>
      <div class="tags" id="tags" aria-hidden="true"></div>
      <div class="stage-top"><span class="pill" id="stagePill">Steg 1 av 8</span></div>
      <div class="stage-bottom">
        <span class="hint"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12M2 8l3-3M2 8l3 3M14 8l-3-3M14 8l-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="hint">Dra för att snurra</span></span>
        <div class="stage-btns">
          <button class="icon-btn sq" type="button" id="zoomOut" data-i18n-label="zoomOut" aria-label="Zooma ut"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg></button>
          <button class="icon-btn sq" type="button" id="zoomIn" data-i18n-label="zoomIn" aria-label="Zooma in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg></button>

      <div class="stage-msg" id="stageMsg"><p data-i18n="loading">Laddar 3D…</p></div>

<script>
(function(){
'use strict';

      e = [[0, function(){ P_('terminals', {}); }], [1.6, function(){ tapP(XL(760), Y(565)); P_('terminals', {pressed:'Swedbank Cloud'}); }], [1.95, function(){ P_('cloud', {typed:0}); }]];
    } else if (i === 6){
      camTo('both'); tags = ['code', 'tablet']; loop = 9.5;
      e = [[0, function(){ T_('code'); P_('cloud', {typed:0}); }], [1.1, function(){ tapP(FIELD[0], FIELD[1]); P_('cloud', {typed:0, focus:true}); }]];
      for (var k = 1; k <= 6; k++) (function(k){ e.push([1.5 + k*0.3, function(){ P_('cloud', {typed:k, focus:true}); }]); })(k);
      e.push([4.0, function(){ tapP(PAIR[0], PAIR[1]); P_('cloud', {typed:6, pressed:true}); }]);
      e.push([4.3, function(){ P_('cloud', {typed:6}); }]);
      e.push([4.9, function(){ T_('yabie'); setTags(['yabie', 'tablet']); }]);
    } else if (i === 7){
      T_('yabie'); P_('cloud', {typed:6}); camTo('final'); tags = ['yabie'];
    }
    setTags(tags);
    tl = new Timeline(e, loop); tl.update(0);
  }

  /* ---------- resize + loop ---------- */
  var W = 1, H = 1;
  function resize(){ var r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
  resize();
  var visible = true;
  if (window.IntersectionObserver) new IntersectionObserver(function(en){ visible = en[0].isIntersecting; }).observe(stage);
  var clock = new THREE.Clock(), first = true;
  function frame(){
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05);
    if (!visible || document.hidden) return;
    now += dt;
    if (tl) tl.update(dt);
    runTweens(dt);
    animRing(tRing); animRing(pRing);
    if (caret.visible) caret.material.opacity = 1, caret.visible = true, caret.scale.y = (Math.floor(now * 2) % 2 === 0) ? 1 : 0.0001;
    drawTerm(); drawPos();
    applyCam();
    renderer.render(scene, camera);
    updateTags(W, H);
    if (first){ first = false; $('#stageMsg').hidden = true; api.ready = true; }
  }
  function refresh(){ tDirty = pDirty = true; fitCache = {}; }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('600 24px Inter'), document.fonts.load('700 24px Inter'), document.fonts.load('300 24px Inter')]).then(refresh, function(){});
  var api = { ready:false, failed:false, play:function(i){ play(i); }, langChanged:function(){ tagText(); } };
  play(cur); camTo(camPreset, 0);
  requestAnimationFrame(frame);
  return api;
}

  if (typeof d.a920 === 'number') goStep(d.a920);
  if (typeof d.pill === 'string'){ var p = $('#stagePill'); if (p) p.textContent = d.pill; } });
try { if (window.parent !== window) window.parent.postMessage({a920ready:true}, '*'); } catch(e){}

catch(err){

}
